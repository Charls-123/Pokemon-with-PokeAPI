<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Luckiest+Guy&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>Pokemon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-principal">
        <div class="logo">
            <img src="assets/img/imgbin_d68e404dacbc9f5bdb37cb934109b90c.png" alt="Logo de pokemon">
        </div>

        <nav id="navegacion">
            <ul class="nav">
                <li class="opciones">Pokedex</li>
                <li class="opciones">Regiones</li>
                <li class="opciones">Personajes</li>
                <li class="opciones">Juegos</li>
            </ul>
        </nav>

    </header>

    <main id="principal">
        <section id="contenedor-busqueda">
            <div class="buscador">
                <input type="text" id="busqueda" placeholder="Ej. lucario o pikachu">
                <button id="btnBuscar">
                    <img class="imgbuscar" src="assets/img/lupa.png" alt="lupa">
                </button>  
            </div>
        </section>

        <section id="notificaciones">

        </section>

        <section id="pokemones">
            
        </section>
    </main>

    <script src="JS/app.js" type="module"></script>
</body>
</html>
